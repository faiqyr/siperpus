# nixpacks.toml
# Konfigurasi build PHP untuk Railway.
# Procfile yang menentukan cara start server (php -S).

[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mysqli",
  "php82Extensions.mbstring",
  "php82Extensions.xml",
  "php82Extensions.curl"
]

[phases.build]
cmds = [
  "cp config/koneksi.php.example config/koneksi.php",
  "mkdir -p logs",
  "chmod 775 logs"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t . router.php"
