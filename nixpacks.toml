# nixpacks.toml
# Konfigurasi build PHP untuk Railway.
# koneksi.php sudah ada di repo dan membaca env vars — tidak perlu cp lagi.

[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mysqli",
  "php82Extensions.mbstring",
  "php82Extensions.xml",
  "php82Extensions.curl"
]

[phases.build]
cmds = [
  "mkdir -p logs",
  "chmod 775 logs"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t . router.php"
